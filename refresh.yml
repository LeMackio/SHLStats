name: Refresh SHL data and deploy

on:
  schedule:
    # Every 20 minutes during Swedish evening game hours (15:00–21:59 UTC)
    - cron: '*/20 15-21 * * *'
    # Every 3 hours the rest of the day
    - cron: '0 0-14/3 * * *'
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch SHL data and build site
        run: node fetch-data.mjs

      # GitHub pauses scheduled workflows after 60 days without repository
      # activity. Committing a tiny heartbeat file once a month keeps it alive
      # through the off-season.
      - name: Monthly keepalive commit
        if: github.event_name == 'schedule'
        run: |
          month=$(date -u +%Y-%m)
          if [ "$(cat .keepalive 2>/dev/null)" != "$month" ]; then
            echo "$month" > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "Keepalive $month"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Refresh SHL data and deploy

on:
  schedule:
    # Every 20 minutes during Swedish evening game hours (15:00–21:59 UTC)
    - cron: '*/20 15-21 * * *'
    # Every 3 hours the rest of the day
    - cron: '0 0-14/3 * * *'
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The app (React, in web/) is built first; fetch-data.mjs puts it next to the data in site/
      - name: Build the app
        run: |
          npm ci --prefix web
          npm --prefix web run build

      # Keeps finished seasons, finished games and headshot links between runs,
      # so each is only fetched from shl.se once
      - uses: actions/cache@v4
        with:
          path: cache
          key: shl-cache-${{ github.run_id }}
          restore-keys: |
            shl-cache-
            headshots-

      - name: Fetch SHL data and build site
        run: node fetch-data.mjs

      # Saves the playoff odds history to the repository whenever new results
      # have come in. A monthly heartbeat commit also stops GitHub from pausing
      # the schedule during the off-season (it pauses after 60 quiet days).
      - name: Save odds history
        if: github.event_name != 'pull_request'
        run: |
          month=$(date -u +%Y-%m)
          if [ "$(cat .keepalive 2>/dev/null)" != "$month" ]; then echo "$month" > .keepalive; fi
          git add history/odds.json .keepalive
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update odds history"
            git pull --rebase --quiet
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHLstats</title>
<meta name="description" content="SHL-statistik: tabell, slutspelsodds, matcher, spelar- och lagstatistik.">
<script>
  // Apply the saved theme before first paint
  try { var t = localStorage.getItem('shlstats-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="strip" aria-label="Matcher">
  <button class="strip-btn" id="strip-prev" aria-label="Tidigare matcher">‹</button>
  <div class="strip-track" id="strip"></div>
  <button class="strip-btn" id="strip-next" aria-label="Senare matcher">›</button>
</div>

<header class="top">
  <div class="top-in">
    <a class="brand" href="#/" aria-label="SHLstats startsida">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <rect x="1" y="1" width="38" height="38" rx="10" style="fill:var(--accent)"/>
        <ellipse cx="20" cy="26" rx="11" ry="4.2" style="fill:var(--accent-ink)"/>
        <rect x="9" y="19" width="22" height="7" style="fill:var(--accent-ink)"/>
        <ellipse cx="20" cy="19" rx="11" ry="4.2" style="fill:var(--accent);stroke:var(--accent-ink)" stroke-width="1.6"/>
        <path d="M20 5v8M16.5 7l3.5 3 3.5-3" style="fill:none;stroke:var(--accent-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-word">SHL<em>stats</em></span>
    </a>
    <nav class="main" aria-label="Sidor">
      <a href="#/" data-nav="">Översikt</a>
      <a href="#/matcher" data-nav="matcher">Matcher</a>
      <a href="#/tabell" data-nav="tabell">Tabell</a>
      <a href="#/statistik" data-nav="statistik">Spelarstatistik</a>
      <a href="#/lag" data-nav="lag">Lag</a>
      <a href="#/metod" data-nav="metod">Metod</a>
    </nav>
    <div class="top-tools">
      <div class="gsearch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="gsearch" type="search" placeholder="Sök spelare eller lag" autocomplete="off" aria-label="Sök spelare eller lag">
        <div class="results" id="gsearch-results" hidden></div>
      </div>
      <div class="theme-toggle" role="group" aria-label="Färgtema">
        <button id="theme-dark" aria-label="Mörkt tema" aria-pressed="false"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg></button>
        <button id="theme-light" aria-label="Ljust tema" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg></button>
      </div>
    </div>
  </div>
</header>

<main id="app"><div class="loading">Laddar SHL-data…</div></main>
<footer id="foot"></footer>
<script src="app.js"></script>
</body>
</html>

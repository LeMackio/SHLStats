<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHLstats</title>
<meta name="description" content="SHL-statistik: tabell, slutspelsodds, matcher, målvideor, spelar- och lagstatistik.">
<!-- Saved to the home screen it opens full screen like an app -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#151a22" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#dbe2e9" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SHLstats">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%238fb4dc'/%3E%3Cellipse cx='20' cy='24' rx='11' ry='4.5' fill='%23121820'/%3E%3Crect x='9' y='17' width='22' height='7' fill='%23121820'/%3E%3Cellipse cx='20' cy='17' rx='11' ry='4.5' fill='%238fb4dc' stroke='%23121820' stroke-width='1.6'/%3E%3C/svg%3E">
<script>
  // Apply the saved theme before first paint
  try { var t = localStorage.getItem('shlstats-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="strip" aria-label="Matcher">
  <div class="strip-track" id="strip"></div>
  <div class="strip-ctrl">
    <button class="strip-btn" id="strip-prev" aria-label="Tidigare matcher">‹</button>
    <button class="strip-today" id="strip-today" title="Hoppa till dagens matcher">Idag</button>
    <button class="strip-btn" id="strip-next" aria-label="Senare matcher">›</button>
  </div>
</div>

<header class="top">
  <div class="top-in">
    <a class="brand" href="#/" aria-label="SHLstats startsida">
      <!-- Replaced by src/logo.svg or src/logo.png when one of them exists -->
      <span class="brand-mark" id="brand-mark"><svg viewBox="0 0 40 40" aria-hidden="true">
        <rect x="1" y="1" width="38" height="38" rx="10" style="fill:var(--accent)"/>
        <ellipse cx="20" cy="26" rx="11" ry="4.2" style="fill:var(--accent-ink)"/>
        <rect x="9" y="19" width="22" height="7" style="fill:var(--accent-ink)"/>
        <ellipse cx="20" cy="19" rx="11" ry="4.2" style="fill:var(--accent);stroke:var(--accent-ink)" stroke-width="1.6"/>
        <path d="M20 5v8M16.5 7l3.5 3 3.5-3" style="fill:none;stroke:var(--accent-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg></span>
      <span class="brand-word">SHL<em>stats</em></span>
    </a>
    <nav class="main" aria-label="Sidor">
      <a href="#/" data-nav="">Översikt</a>
      <a href="#/matcher" data-nav="matcher">Matcher</a>
      <a href="#/tabell" data-nav="tabell">Tabell</a>
      <a href="#/statistik" data-nav="statistik">Spelare</a>
      <a href="#/lag" data-nav="lag">Lag</a>
    </nav>
    <div class="top-tools">
      <a class="favlink" id="favlink" hidden></a>
      <div class="gsearch">
        <button class="search-toggle" id="search-open" aria-label="Sök spelare eller lag"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="gsearch" type="search" placeholder="Sök spelare eller lag" autocomplete="off" aria-label="Sök spelare eller lag" enterkeyhint="search">
        <kbd class="kbd" aria-hidden="true">/</kbd>
        <button class="search-cancel" id="search-close">Avbryt</button>
        <div class="results" id="gsearch-results" hidden></div>
      </div>
      <div class="theme-toggle" role="group" aria-label="Färgtema">
        <button id="theme-dark" aria-label="Mörkt tema" aria-pressed="false"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg></button>
        <button id="theme-light" aria-label="Ljust tema" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg></button>
      </div>
    </div>
  </div>
</header>

<main id="app" aria-busy="true">
  <div class="skel-page" aria-label="Laddar SHL-data">
    <div class="skel skel-title"></div>
    <div class="skel skel-hero"></div>
    <div class="skel-grid"><div class="skel skel-card"></div><div class="skel skel-card"></div></div>
  </div>
</main>
<footer id="foot"></footer>

<!-- Phones: main menu as a bottom bar (icons are added by app.js) -->
<nav class="bottom-nav" aria-label="Meny">
  <a href="#/" data-nav="">Översikt</a>
  <a href="#/matcher" data-nav="matcher">Matcher</a>
  <a href="#/tabell" data-nav="tabell">Tabell</a>
  <a href="#/statistik" data-nav="statistik">Spelare</a>
  <a href="#/lag" data-nav="lag">Lag</a>
</nav>

<dialog class="video" id="video" aria-label="Video">
  <div class="video-head"><b id="video-title"></b><button class="video-close" id="video-close" aria-label="Stäng video">✕</button></div>
  <div class="video-frame"><iframe id="video-frame" title="Video" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>
  <p class="video-note">Video från SHL via Staylive.</p>
</dialog>
<script src="app.js"></script>
</body>
</html>

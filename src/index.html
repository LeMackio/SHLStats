<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHLstats</title>
<meta name="description" content="SHL-statistik: tabell, slutspelsodds, matcher, målvideor, spelar- och lagstatistik.">
<!-- Saved to the home screen it opens full screen like an app -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#151a22" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#dbe2e9" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SHLstats">
<!-- Tab icon: the puck, black on light browser themes and white on dark ones (the PNGs are for browsers without SVG icons) -->
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=3">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png?v=3">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<script>
  // Apply the saved theme before first paint
  try { var t = localStorage.getItem('shlstats-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Archivo:ital,wdth,wght@1,62..125,900&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="strip" aria-label="Matcher">
  <div class="strip-track" id="strip"></div>
  <div class="strip-ctrl">
    <button class="strip-btn" id="strip-prev" aria-label="Tidigare matcher">‹</button>
    <button class="strip-today" id="strip-today" title="Hoppa till dagens matcher">Idag</button>
    <button class="strip-btn" id="strip-next" aria-label="Senare matcher">›</button>
  </div>
</div>

<header class="top">
  <div class="top-in">
    <a class="brand" href="#/" aria-label="SHLstats startsida">
      <img class="brand-mark" src="icons/logo-mark.png?v=3" alt="" width="50" height="25">
      <span class="brand-word">SHL<em>stats</em></span>
    </a>
    <!-- Phones: the page name (with a back arrow on sub pages) replaces the logo outside Hem -->
    <button class="m-back" id="m-back" aria-label="Tillbaka"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="m-title brand-word" id="m-title"></span>
    <nav class="main" aria-label="Sidor">
      <a href="#/" data-nav="">Översikt</a>
      <a href="#/statistik" data-nav="statistik">Statistik</a>
      <a href="#/tabell" data-nav="tabell">Tabell</a>
      <a href="#/matcher" data-nav="matcher">Matcher</a>
      <a href="#/nexus" data-nav="nexus">Nexus</a> <!-- desktop only for now: the top menu is hidden on phones -->
    </nav>
    <div class="top-tools">
      <button class="settings-btn" id="settings-open" aria-label="Inställningar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.54 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.65 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c.26.6.85 1 1.51 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.03z"/></svg></button>
      <a class="favlink" id="favlink" hidden></a>
      <div class="gsearch">
        <button class="search-toggle" id="search-open" aria-label="Sök spelare eller lag"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="gsearch" type="search" placeholder="Sök spelare eller lag" autocomplete="off" aria-label="Sök spelare eller lag" enterkeyhint="search">
        <kbd class="kbd" aria-hidden="true">/</kbd>
        <button class="search-cancel" id="search-close">Avbryt</button>
        <div class="results" id="gsearch-results" hidden></div>
      </div>
      <div class="theme-toggle" role="group" aria-label="Färgtema">
        <button id="theme-dark" aria-label="Mörkt tema" title="Mörkt" aria-pressed="false"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg></button>
        <button id="theme-light" aria-label="Ljust tema" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg></button>
      </div>
    </div>
  </div>
</header>

<main id="app" aria-busy="true">
  <div class="skel-page" aria-label="Laddar SHL-data">
    <div class="skel skel-title"></div>
    <div class="skel skel-hero"></div>
    <div class="skel-grid"><div class="skel skel-card"></div><div class="skel skel-card"></div></div>
  </div>
</main>
<footer id="foot"></footer>

<!-- Phones: main menu as a bottom bar (icons are added by app.js) -->
<nav class="bottom-nav" aria-label="Meny">
  <a href="#/" data-nav="">Hem</a>
  <a href="#/matcher" data-nav="matcher">Matcher</a>
  <a href="#/statistik" data-nav="statistik">Statistik</a>
  <a href="#/tabell" data-nav="tabell">Tabell</a>
  <a href="#/media" data-nav="media">Media</a>
</nav>
<!-- Phones: settings sheet (theme and your team), opened from the gear on Hem -->
<dialog class="sheet" id="settings" aria-label="Inställningar"></dialog>

<dialog class="video" id="video" aria-label="Video">
  <div class="video-head"><b id="video-title"></b><button class="video-close" id="video-close" aria-label="Stäng video">✕</button></div>
  <div class="video-frame"><iframe id="video-frame" title="Video" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>
  <p class="video-note">Video från SHL via Staylive.</p>
</dialog>
<script src="app.js"></script>
</body>
</html>
